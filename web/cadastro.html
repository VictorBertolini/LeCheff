<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Le Cheff</title>
</head>
<body>
    <header id="lecheff__index-header">
        <a href="index.html"       class="lecheff__item-header">Página Inicial</a>
        <a href="login.html"       class="lecheff__item-header">Login</a>
        <a href="cadastro.html"    class="lecheff__item-header">Cadastro</a>
        <a href="cliente.html"     class="lecheff__item-header">Cliente</a>
        <a href="cheff.html"       class="lecheff__item-header">Cheff</a>
        <a href="prato.html"       class="lecheff__item-header">Prato</a>
        <a href="integrantes.html" class="lecheff__item-header">Integrantes</a>
    </header>

    <h1 id="lecheff__h1">Le Cheff</h1>

    <section id="lecheff__form-section">
        <fieldset id="lecheff__fieldset">
            <legend>Cadastro do Cliente</legend>
            <form class="lecheff__form" action="clientes" method="post">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" placeholder="Informe o nome" required autofocus>

                <label for="idade">Idade:</label>
                <input type="number" name="idade" id="idade" placeholder="Informe a idade" min="0">

                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Informe o email" required>

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" placeholder="Informe a senha" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" name="telefone" id="telefone" placeholder="Informe o telefone" required>

                <button type="submit">Cadastrar</button>
            </form>
        </fieldset>
    </section>
</body>
</html>
